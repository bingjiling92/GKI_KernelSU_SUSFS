name: 'Setup Misc Configs'
description: 'Set up kernel configuration fragment with miscellaneous options'
inputs:
  version:
    description: 'Kernel config version (e.g., android14-6.12)'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.1)'
    required: true
  android_version:
    description: 'Android version (e.g., android14)'
    required: true
  sublevel:
    description: 'Sublevel of kernel version (e.g., 1)'
    required: true
  variant:
    description: 'Build variant (Normal, Bypass, Wild, boot-time)'
    required: true

# ---------------------------------------------------------------------------
# icecream bisect step A -- brand name only, zero config deviation
#
# Two icecream builds have failed to boot (first screen, then reaching the
# native UI before resetting). The only setting both shared that the working
# baseline does not have is CONFIG_ZRAM=y, but neither failure produced any
# captureable log, so the cause is not yet proven.
#
# This step removes every config deviation and changes only the brand string,
# so it answers one question: does the build pipeline itself still produce a
# bootable kernel? If this boots, the pipeline is fine and the delta is one of
# the settings. If this fails, the pipeline or branch state is at fault.
#
# config_list is interpolated into a bash script: comments stay plain ASCII.
# ---------------------------------------------------------------------------
runs:
  using: "composite"
  steps:
    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
