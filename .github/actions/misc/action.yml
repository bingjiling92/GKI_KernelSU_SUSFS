name: 'Setup Misc Configs'
description: 'Set up kernel configuration fragment with miscellaneous options'
inputs:
  version:
    description: 'Kernel config version (e.g., android14-6.12)'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.1)'
    required: true
  android_version:
    description: 'Android version (e.g., android14)'
    required: true
  sublevel:
    description: 'Sublevel of kernel version (e.g., 1)'
    required: true
  variant:
    description: 'Build variant (Normal, Bypass, Wild, boot-time)'
    required: true

# ---------------------------------------------------------------------------
# icecream config
#
# Every entry below was checked against stock_6.1.138.config and the live
# /proc/cmdline. Only real deltas are kept; entries whose stock value is
# already correct are omitted because they would be no-ops.
#
# Runtime evidence gathered from the device:
#   - kasan=off          -> KASAN is disabled at runtime; turning the compile
#                           option off yields no speedup, so it is left alone.
#   - slub_debug=-       -> SLUB_DEBUG is disabled at runtime; left alone.
#   - KFENCE             -> /sys/kernel/debug/kfence absent, sampling off.
#   - no init_on_alloc=0 -> INIT_ON_ALLOC_DEFAULT_ON is actually active, so
#                           this is a genuine hot-path cost.
#
# NOTE: config_list is interpolated into a bash script. Every comment inside
# it MUST be plain ASCII without quotes, otherwise the shell parses Chinese
# punctuation as commands (this exact bug broke run #13 with
# "line 29: VFS: command not found").
# ---------------------------------------------------------------------------
runs:
  using: "composite"
  steps:
    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y

          # 1. zram builtin with lz4 default.
          # Dependency chain from live modules.dep: zram.ko -> zsmalloc.ko,
          # and no module depends on zram, so building it in cannot break
          # vendor module symbol lookups.
          CONFIG_ZRAM=y
          CONFIG_ZSMALLOC=y
          CONFIG_ZRAM_DEF_COMP_LZ4=y
          CONFIG_ZRAM_DEF_COMP_LZ4KD=n
          CONFIG_ZRAM_DEF_COMP_LZO=n
          CONFIG_ZRAM_DEF_COMP_LZORLE=n
          CONFIG_ZRAM_DEF_COMP_ZSTD=n
          CONFIG_ZRAM_MULTI_COMP=y
          CONFIG_ZRAM_WRITEBACK=y
          CONFIG_CRYPTO_LZ4=y
          CONFIG_CRYPTO_LZ4HC=y

          # 2. Relax module version check.
          # hybridmount-android14-6.1.ko is built with vermagic 6.1.166-dirty
          # and is rejected on a 6.1.138 kernel, which makes Hybrid Mount
          # report a foreign VFS implementation.
          CONFIG_MODULE_FORCE_LOAD=y
          CONFIG_MODULE_FORCE_UNLOAD=y

          # 3. Power saving (stock does not enable this).
          CONFIG_WQ_POWER_EFFICIENT_DEFAULT=y

          # 4. Performance (stock enables these, real hot-path cost).
          # INIT_ON_ALLOC zeroes every kmalloc allocation; 1-5 percent loss.
          # DEBUG_LIST validates list pointers on every add/del, expanded at
          # compile time so it cannot be turned off from the command line.
          CONFIG_INIT_ON_ALLOC_DEFAULT_ON=n
          CONFIG_DEBUG_LIST=n
