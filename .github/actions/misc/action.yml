name: 'Setup Misc Configs'
description: 'Set up kernel configuration fragment with miscellaneous options'
inputs:
  version:
    description: 'Kernel config version (e.g., android14-6.12)'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.1)'
    required: true
  android_version:
    description: 'Android version (e.g., android14)'
    required: true
  sublevel:
    description: 'Sublevel of kernel version (e.g., 1)'
    required: true
  variant:
    description: 'Build variant (Normal, Bypass, Wild, boot-time)'
    required: true

# ---------------------------------------------------------------------------
# icecream phase 1 -- zram KMI rollback
#
# Run #15 built with CONFIG_ZRAM=y and the device bootlooped on the first
# screen: the kernel loads, the vendor modules never come up, the watchdog
# resets. The repo already carried the reason, in
# .github/actions/lz4kd-houji/action.yml lines 43-46:
#
#   # v5: ZRAM stays =m (stock GKI). Building it in (=y) changes symbol
#   # CRCs and breaks all 497 vendor modules -> early-boot bootloop
#   # (proven by v3/v4).
#
# v5 (commit b468988) reverted to ZRAM=m for exactly this reason. I overrode
# that warning with my own reasoning about the zram -> zsmalloc dependency
# chain, and that reasoning was wrong.
#
# Phase 1 therefore keeps zram/zsmalloc as modules, identical to v5, and adds
# only entries that cannot change exported symbols:
#   - MODULE_FORCE_LOAD / MODULE_FORCE_UNLOAD : relax a version check
#   - WQ_POWER_EFFICIENT_DEFAULT              : runtime scheduler default
#   - INIT_ON_ALLOC_DEFAULT_ON=n              : runtime default, no symbol
#
# Deliberately NOT changed yet (phase 2, one variable at a time):
#   CONFIG_DEBUG_LIST -- disabling it removes the __list_add_valid and
#   __list_del_entry_valid exports, which vendor modules may reference.
#
# config_list is interpolated into a bash script, so every comment inside it
# stays plain ASCII and unquoted.
# ---------------------------------------------------------------------------
runs:
  using: "composite"
  steps:
    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y

          # Allow modules whose vermagic does not match, for example
          # hybridmount built for 6.1.166 running on a 6.1.138 kernel.
          CONFIG_MODULE_FORCE_LOAD=y
          CONFIG_MODULE_FORCE_UNLOAD=y

          # Power saving: idle workqueues stop spinning a bound worker.
          CONFIG_WQ_POWER_EFFICIENT_DEFAULT=y

          # Performance: stop zeroing every kmalloc allocation by default.
          CONFIG_INIT_ON_ALLOC_DEFAULT_ON=n
