name: 'Setup Misc Configs'
description: 'Set up kernel configuration fragment with miscellaneous options'
inputs:
  version:
    description: 'Kernel config version (e.g., android14-6.12)'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.1)'
    required: true
  android_version:
    description: 'Android version (e.g., android14)'
    required: true
  sublevel:
    description: 'Sublevel of kernel version (e.g., 1)'
    required: true
  variant:
    description: 'Build variant (Normal, Bypass, Wild, boot-time)'
    required: true

# ---------------------------------------------------------------------------
# icecream bisect step B -- add back the zram built-in group only
#
# Step A (brand name only, zero config deviation) booted successfully.
# Conclusion: the build pipeline and branch state are fine, and the brand
# string is irrelevant. The failure must be one of the config entries.
#
# Step B adds back ONLY the zram built-in group, which is the prerequisite for
# lz4kd to appear in comp_algorithm (the zcomp backend table lives inside
# zram.ko, and zram.ko is loaded at 0.233660s by first-stage init from
# /lib/modules/, far earlier than post-fs-data, so a module overlay cannot
# change it).
#
# Deliberately NOT included in step B (added later, one group at a time):
#   CONFIG_WQ_POWER_EFFICIENT_DEFAULT / CONFIG_INIT_ON_ALLOC_DEFAULT_ON
#
# The crypto backends CONFIG_CRYPTO_LZ4K/LZ4KD are already appended to
# gki_defconfig unconditionally by .github/actions/lz4kd-houji, so they are
# present in every build including the working ones; they are not re-declared.
#
# config_list is interpolated into a bash script: comments stay plain ASCII.
# ---------------------------------------------------------------------------
runs:
  using: "composite"
  steps:
    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y

          # zram built into vmlinux so the zcomp backend table (which carries
          # lz4kd) is present in the running kernel.
          CONFIG_ZRAM=y
          CONFIG_ZSMALLOC=y
          CONFIG_ZRAM_DEF_COMP_LZ4KD=y
          CONFIG_ZRAM_DEF_COMP_LZO=n
          CONFIG_ZRAM_DEF_COMP_LZORLE=n
          CONFIG_ZRAM_DEF_COMP_LZ4=n
          CONFIG_ZRAM_DEF_COMP_ZSTD=n
          CONFIG_ZRAM_MULTI_COMP=y
          CONFIG_ZRAM_WRITEBACK=y

          # Tolerate the stale /system_dlkm zram.ko, which first-stage init
          # still tries to load into a kernel that already has zram built in.
          CONFIG_MODULE_FORCE_LOAD=y
          CONFIG_MODULE_FORCE_UNLOAD=y
